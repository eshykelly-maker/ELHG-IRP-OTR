        <script>
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'TOGGLE_LAYER') {
                    if (window.layersList) {
                        var layerTitle = event.data.layerTitle;
                        var visible = event.data.visible;
                        for (var i=0; i<window.layersList.length; i++) {
                            var title = window.layersList[i].get('title');
                            // Clean HTML from title if it has image tag
                            var cleanTitle = title;
                            if (cleanTitle.indexOf('<img') > -1) {
                                // Extract the text after img tag or just strip tags
                                cleanTitle = cleanTitle.replace(/<[^>]*>/g, '').trim();
                            }
                            if (cleanTitle.indexOf(layerTitle) > -1 || layerTitle === title) {
                                window.layersList[i].setVisible(visible);
                            }
                        }
                    }
                } else if (event.data && event.data.type === 'CLEAR_ALL_LAYERS') {
                    if (window.layersList) {
                        for (var i=0; i<window.layersList.length; i++) {
                             // Let's keep Google Satellite (index 0) visible perhaps? Or hide all?
                             // Usually "mapa limpo" means just the basemap.
                            if (i > 0) window.layersList[i].setVisible(false);
                        }
                    }
                }
            });
        </script>
    </body>
